name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/kit/check-agents.mjs
      - run: node scripts/kit/check-spec.mjs
      - run: {{CHECK_TASK}}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
